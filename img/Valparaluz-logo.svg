<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Base/Pared de la casa (Terracota principal) -->
  <path d="M 20 42 L 80 42 L 80 86 A 4 4 0 0 1 76 90 L 24 90 A 4 4 0 0 1 20 86 Z" fill="#D66D3A" />
  
  <!-- Techo/Teja de la casa (Terracota oscuro para contraste) -->
  <path d="M 50 10 L 92 42 L 8 42 Z" fill="#B85A2D" stroke="#B85A2D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Franja concéntrica interior color crema (Incluye línea divisoria de techo) -->
  <path d="M 50 18 L 82 42 L 74 42 L 74 84 L 26 84 L 26 42 L 18 42 Z M 26 42 L 74 42" 
        fill="none" stroke="#FDFBF7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Letras VL en color crema, perfectamente centradas en la pared -->
  <text x="50%" y="64%" 
        dominant-baseline="middle" 
        text-anchor="middle" 
        fill="#FDFBF7" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="30" 
        letter-spacing="-1">
    VL
  </text>
</svg>
